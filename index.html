<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Dark Mode Button -->
        <button id="themeBtn">🌙 Dark Mode</button>

        <!-- Title -->
        <h1>📝 My Todo List</h1>

        <!-- Search Box -->
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >
        </div>

        <!-- Add Task -->
        <div class="input-group">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >
            <button id="addBtn">Add</button>
        </div>

        <!-- Counter -->
        <p id="counter">0 / 0 Completed</p>

        <!-- Message -->
        <p id="message"></p>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Delete Completed -->
        <button id="deleteCompletedBtn">
            🗑 Delete Completed
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
